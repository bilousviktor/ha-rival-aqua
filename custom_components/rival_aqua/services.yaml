get_schedule:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: rival_aqua

set_schedule:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: rival_aqua
    points:
      required: true
      example: >-
        [{"time": "09:00", "levels": [0, 0, 0, 0, 0]},
         {"time": "11:00", "levels": {"Cool White": 60, "Warm White": 10, "Red": 10}},
         {"time": "20:00", "levels": [60, 10, 10, 10, 10]},
         {"time": "22:00", "levels": [0, 0, 0, 0, 0]}]
      selector:
        object:

set_hotspot:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: rival_aqua
    name:
      required: false
      example: Rival_LED
      selector:
        text:
    password:
      required: false
      selector:
        text:
          type: password

scan_wifi:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: rival_aqua

connect_wifi:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: rival_aqua
    ssid:
      required: true
      selector:
        text:
    password:
      required: true
      selector:
        text:
          type: password

forget_wifi:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: rival_aqua

factory_reset:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: rival_aqua
